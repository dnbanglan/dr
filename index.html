<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দৃষ্টি রেখা - HD ফটোকার্ড জেনারেটর</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif, 'SolaimanLipi', 'Kalpurush';
            background-color: #121824;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #43b581;
            text-align: center;
        }

        .main-wrapper {
            display: flex;
            flex-direction: row;
            gap: 30px;
            background-color: #1a2233;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            max-width: 1400px;
            width: 100%;
        }

        /* Responsive Preview Container */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
        }

        .card-scaler-box {
            width: 100%;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            border-radius: 4px;
            overflow: hidden;
            background-color: #000;
        }

        /* Absolute Original 1920px Base Canvas */
        #photocard {
            width: 1920px;
            height: 1920px; /* Default height with ad */
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            background-color: #006D17;
            overflow: hidden;
            font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
        }

        /* 1. Feature Image Frame (1920x1080) */
        .feature-img-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #0d131d;
            z-index: 1;
        }

        #feature-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center center;
        }

        .placeholder-text {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5865f2;
            font-size: 45px;
            border: 4px dashed #2f3850;
        }

        /* 2. Date Box (Y: 88px, Height: 76px, Left: 1495.857px, Width: 426px) */
        .date-box {
            position: absolute;
            top: 88px;
            left: 1495.857px;
            width: 426px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 38px;
            font-weight: bold;
            z-index: 10;
            background-color: rgba(0, 109, 23, 0.30); /* 30% green opacity */
            border-bottom: 3px solid #ffffff;
        }

        /* 3. Logo Layer (Y: 1011px to 1142px = 131px height, Topmost layer z-index 100, 2x Scale) */
        .logo-container {
            position: absolute;
            top: 1011px;
            left: 0;
            width: 1920px;
            height: 131px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100; /* Top Layer */
            pointer-events: none;
        }

        .logo-container img {
            max-height: 131px;
            transform: scale(2); /* 2x Larger scale */
            transform-origin: center center;
        }

        /* 4. White Line (Y: 1072px to 1080px = 8px Height) */
        .white-line {
            position: absolute;
            top: 1072px;
            left: 0;
            width: 1920px;
            height: 8px;
            background-color: #ffffff;
            z-index: 5;
        }

        /* 5. Headline Box (Y: 1153px to 1488px = 335px Height) */
        .headline-wrapper {
            position: absolute;
            top: 1153px;
            left: 0;
            width: 1920px;
            height: 335px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 100px;
            box-sizing: border-box;
            z-index: 10;
        }

        .headline-text {
            color: #ffffff;
            font-size: 72px;
            font-weight: bold;
            text-align: center;
            line-height: 1.35;
            width: 100%;
            word-wrap: break-word;
        }

        /* 7. Comment Text (Y: 1488px to 1544px = 56px Height) */
        .comment-text-box {
            position: absolute;
            top: 1488px;
            left: 0;
            width: 1920px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 34px;
            font-weight: 600;
            z-index: 10;
        }

        /* 7. Social & Website Bar (Y: 1542px to 1631px = 89px Height, Gradient #101F3C) */
        .social-bar {
            position: absolute;
            top: 1542px;
            left: 0;
            width: 1920px;
            height: 89px;
            z-index: 10;
            background: linear-gradient(
                90deg,
                rgba(16, 31, 60, 0) 0px,
                rgba(16, 31, 60, 0.35) 150px,
                rgba(16, 31, 60, 1) 300px,
                rgba(16, 31, 60, 1) 1620px,
                rgba(16, 31, 60, 0.35) 1770px,
                rgba(16, 31, 60, 0) 1920px
            );
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-link {
            position: absolute;
            left: 400px;
            color: #ffffff;
            font-size: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-links {
            position: absolute;
            right: 400px;
            color: #ffffff;
            font-size: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .social-icon {
            width: 28px;
            height: 28px;
            fill: #ffffff;
        }

        /* 8. Ad Banner Frame (Y: 1642px to 1920px = 278px Height) */
        .ad-banner-frame {
            position: absolute;
            top: 1642px;
            left: 0;
            width: 1920px;
            height: 278px;
            z-index: 10;
            background-color: #000;
            overflow: hidden;
        }

        .ad-banner-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Control Panel Styles */
        .controls-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background-color: #232d3f;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .panel-box h3 {
            font-size: 16px;
            color: #38bdf8;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input[type="text"], textarea, input[type="date"], select {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            height: 65px;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .slider-group label {
            width: 120px;
            margin-bottom: 0;
        }

        input[type="range"] {
            flex: 1;
            accent-color: #38bdf8;
        }

        .btn-action {
            background-color: #334155;
            color: #f87171;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-action:hover {
            background-color: #475569;
        }

        .btn-today {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-download {
            background-color: #16a34a;
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: #15803d;
        }

        .upload-btn {
            display: block;
            padding: 10px;
            background-color: #0f172a;
            color: #94a3b8;
            text-align: center;
            border: 1px dashed #475569;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .upload-btn:hover {
            border-color: #38bdf8;
            color: #fff;
        }

        input[type="file"] {
            display: none;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        @media (max-width: 950px) {
            .main-wrapper {
                flex-direction: column;
            }
            .preview-container {
                max-width: 100%;
            }
        }
    </style>
    <!-- HTML2Canvas Library for HD Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

    <script>
        // DOM Elements
        const photocard = document.getElementById('photocard');
        const scalerBox = document.getElementById('scaler-box');

        const imgInput = document.getElementById('img-input');
        const featureImg = document.getElementById('feature-img');
        const placeholderTxt = document.getElementById('placeholder-txt');
        const imgScale = document.getElementById('img-scale');
        const imgPanX = document.getElementById('img-pan-x');
        const imgPanY = document.getElementById('img-pan-y');

        const datePicker = document.getElementById('date-picker');
        const cardDateDisp = document.getElementById('card-date-disp');
        const btnAutoDate = document.getElementById('btn-auto-date');

        const headlineInput = document.getElementById('headline-input');
        const cardHeadlineDisp = document.getElementById('card-headline-disp');
        const fontSizeInput = document.getElementById('font-size');
        const sideMarginInput = document.getElementById('side-margin');

        const toggleComment = document.getElementById('toggle-comment');
        const commentBox = document.getElementById('comment-box');

        const toggleAd = document.getElementById('toggle-ad');
        const adBannerBox = document.getElementById('ad-banner-box');
        const adImgDisp = document.getElementById('ad-img-disp');
        const adCycleSelect = document.getElementById('ad-cycle-select');

        const downloadBtn = document.getElementById('download-btn');

        // Layout Updater
        function refreshCardLayout() {
            const hasAd = toggleAd.checked;
            const currentHeight = hasAd ? 1920 : 1642;

            photocard.style.height = `${currentHeight}px`;
            adBannerBox.style.display = hasAd ? 'block' : 'none';

            // Aspect ratio calculation for scaling container
            scalerBox.style.paddingTop = `${(currentHeight / 1920) * 100}%`;
            
            updateScale();
        }

        function updateScale() {
            const wrapperWidth = scalerBox.clientWidth;
            const scale = wrapperWidth / 1920;
            photocard.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', updateScale);

        // Date Helpers
        function toBanglaNum(str) {
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return String(str).replace(/[0-9]/g, digit => banglaDigits[digit]);
        }

        function formatBanglaDate(date) {
            const months = [
                'জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন',
                'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'
            ];
            const day = toBanglaNum(String(date.getDate()).padStart(2, '0'));
            const month = months[date.getMonth()];
            const year = toBanglaNum(String(date.getFullYear()));

            return `${day} ${month} ${year}`;
        }

        function setTodayDate() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            
            datePicker.value = `${y}-${m}-${d}`;
            cardDateDisp.textContent = formatBanglaDate(today);
        }

        btnAutoDate.addEventListener('click', setTodayDate);
        datePicker.addEventListener('change', (e) => {
            if (e.target.value) {
                const parts = e.target.value.split('-');
                const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
                cardDateDisp.textContent = formatBanglaDate(selectedDate);
            }
        });

        // Feature Image Handlers
        imgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    featureImg.src = event.target.result;
                    featureImg.style.display = 'block';
                    placeholderTxt.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function applyImgTransform() {
            const s = imgScale.value;
            const x = imgPanX.value;
            const y = imgPanY.value;
            featureImg.style.transform = `scale(${s}) translate(${x}px, ${y}px)`;
        }

        imgScale.addEventListener('input', applyImgTransform);
        imgPanX.addEventListener('input', applyImgTransform);
        imgPanY.addEventListener('input', applyImgTransform);

        document.getElementById('reset-scale').addEventListener('click', () => { imgScale.value = 1; applyImgTransform(); });
        document.getElementById('reset-pan-x').addEventListener('click', () => { imgPanX.value = 0; applyImgTransform(); });
        document.getElementById('reset-pan-y').addEventListener('click', () => { imgPanY.value = 0; applyImgTransform(); });

        // Auto Balanced 2-line Headline Handler
        function updateHeadline() {
            const text = headlineInput.value.trim();
            const fSize = Number(fontSizeInput.value);
            const margin = Number(sideMarginInput.value);

            const container = document.querySelector('.headline-wrapper');
            container.style.paddingLeft = `${margin}px`;
            container.style.paddingRight = `${margin}px`;

            cardHeadlineDisp.style.fontSize = `${fSize}px`;
            cardHeadlineDisp.textContent = text;
        }

        headlineInput.addEventListener('input', updateHeadline);
        fontSizeInput.addEventListener('input', updateHeadline);
        sideMarginInput.addEventListener('input', updateHeadline);

        // Toggles & Ad Cycle
        toggleComment.addEventListener('change', (e) => {
            commentBox.style.display = e.target.checked ? 'flex' : 'none';
        });

        toggleAd.addEventListener('change', refreshCardLayout);

        adCycleSelect.addEventListener('change', (e) => {
            adImgDisp.src = e.target.value;
        });

        // Download Action (Captures exact layout including Ad Banner)
        downloadBtn.addEventListener('click', () => {
            downloadBtn.textContent = "ডাউনলোড তৈরি হচ্ছে...";
            downloadBtn.disabled = true;

            const hasAd = toggleAd.checked;
            const targetHeight = hasAd ? 1920 : 1642;
            const currentTransform = photocard.style.transform;
            
            photocard.style.transform = 'none';

            html2canvas(photocard, {
                width: 1920,
                height: targetHeight,
                scale: 1,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#006D17'
            }).then(canvas => {
                photocard.style.transform = currentTransform;
                
                const link = document.createElement('a');
                link.download = `DrishtiRekha_Photocard_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.98);
                link.click();

                downloadBtn.textContent = "ফটোকার্ড ডাউনলোড করুন (HD JPG)";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error(err);
                alert('ফটোকার্ড জেনারেট করতে সমস্যা দেখা দিয়েছে!');
                photocard.style.transform = currentTransform;
                downloadBtn.textContent = "ফটোকার্ড ডাউনলোড করুন (HD JPG)";
                downloadBtn.disabled = false;
            });
        });

        // Initial Initialization
        setTodayDate();
        refreshCardLayout();
        updateHeadline();
    </script>
</body>
</html>
